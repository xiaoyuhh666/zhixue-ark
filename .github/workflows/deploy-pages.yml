# 智学方舟 前端发布：push 到 main 自动构建并部署 GitHub Pages
#
# 前置要求（一次性，在 GitHub 网页操作）：
# 1. 仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」
# 2. 仓库 Settings → Secrets and variables → Actions → Variables 标签页
#    新增 Variable：Name = API_BASE，Value = Render 后端地址
#    （如 https://zhixue-ark.onrender.com，不带末尾斜杠）
#
# 注意：VITE_BASE 必须与仓库子路径一致（用户名/仓库名改动时同步修改）

name: Deploy Frontend to Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发重发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /zhixue-ark/ # 仓库名 zhixue-ark 对应的 Pages 子路径
          VITE_API_BASE: ${{ vars.API_BASE }} # Render 后端地址（仓库 Variable）
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
